<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0907">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Gottlieb's Totem (1979), playable in your browser.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Totem">
  <title>Totem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!--build:head-->
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 16 16"><path fill="currentColor" d="M7 0h2l.4 2.1 1.4.6 1.8-1.2 1.4 1.4-1.2 1.8.6 1.4L16 7v2l-2.1.4-.6 1.4 1.2 1.8-1.4 1.4-1.8-1.2-1.4.6L9 16H7l-.4-2.1-1.4-.6-1.8 1.2-1.4-1.4 1.2-1.8-.6-1.4L0 9V7l2.1-.4.6-1.4-1.2-1.8 1.4-1.4 1.8 1.2 1.4-.6zm1 5a3 3 0 100 6 3 3 0 000-6z"/></symbol>
    <symbol id="i-full" viewBox="0 0 16 16"><path fill="currentColor" d="M1 1h5v2H3v3H1zm9 0h5v5h-2V3h-3zM1 10h2v3h3v2H1zm12 0h2v5h-5v-2h3z"/></symbol>
    <symbol id="i-exit-full" viewBox="0 0 16 16"><path fill="currentColor" d="M4 1h2v5H1V4h3zm6 0h2v3h3v2h-5zM1 10h5v5H4v-3H1zm9 0h5v2h-3v3h-2z"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3.4L3.4 2 8 6.6 12.6 2 14 3.4 9.4 8l4.6 4.6-1.4 1.4L8 9.4 3.4 14 2 12.6 6.6 8z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v2H2zm0 4h12v2H2zm0 4h12v2H2z"/></symbol>
    <symbol id="i-help" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0a8 8 0 110 16A8 8 0 018 0zm0 11.2a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM8.2 3C6.4 3 5.2 4 5 5.6h2c.1-.6.5-.9 1.1-.9.7 0 1.1.4 1.1 1 0 .5-.3.8-1 1.3-.9.6-1.3 1.2-1.2 2.4V10h1.9v-.5c0-.6.2-.9 1-1.4.9-.6 1.4-1.3 1.4-2.4C11.3 4 10 3 8.2 3z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 16 16"><path fill="currentColor" d="M2 5h3l4-3v12l-4-3H2zm9.5.5a3.5 3.5 0 010 5l-1-1a2 2 0 000-3zm1.8-1.8a6 6 0 010 8.6l-1-1a4.6 4.6 0 000-6.6z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 16 16"><path fill="currentColor" d="M2 5h3l4-3v12l-4-3H2zm8.6.6L12 7l1.4-1.4 1 1L13 8l1.4 1.4-1 1L12 9l-1.4 1.4-1-1L11 8 9.6 6.6z"/></symbol>
  </svg>

  <main id="stage" aria-label="Totem pinball">
    <div id="bg-box"><canvas id="backglass" aria-label="Backglass and scores" role="img"></canvas></div>
    <div id="table-box"><canvas id="table" aria-hidden="true"></canvas></div>

    <div id="hud" hidden>
      <canvas id="strip" aria-hidden="true"></canvas>
      <button class="hud-btn hud-menu" data-action="menu" aria-label="Pause menu"><svg><use href="#i-menu"/></svg></button>
      <button class="hud-btn hud-nudge" data-action="nudgeUp" aria-label="Nudge the table">Nudge</button>
      <div id="tilt-meter" aria-hidden="true"><i></i></div>
      <button class="hud-add" data-action="start" id="add-player" hidden>Add player</button>
      <button class="launch" data-action="plunger" id="launch" hidden><span>Launch</span></button>
      <div id="fps" hidden></div>
    </div>
    <div id="callout" aria-live="polite"></div>

    <div id="panels">
      <!-- Loading -->
      <section class="card" id="panel-boot" data-panel="boot">
        <div class="card-frame">
          <h1 class="card-title">Totem</h1>
          <p class="card-sub" id="boot-text">Setting up the table…</p>
          <div class="meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><i id="boot-bar"></i></div>
        </div>
      </section>

      <!-- No table / error -->
      <section class="card" id="panel-error" data-panel="error" hidden>
        <div class="card-frame">
          <h1 class="card-title">Totem</h1>
          <h2 class="card-head" id="error-title">The table files are missing</h2>
          <div class="card-copy" id="error-text"></div>
          <button class="btn primary" data-cmd="reload">Try again</button>
        </div>
      </section>

      <!-- Home -->
      <section class="card" id="panel-home" data-panel="home" hidden>
        <div class="card-frame">
          <div class="home-top">
            <h1 class="card-title">Totem</h1>
            <p class="card-sub">Gottlieb, 1979</p>
          </div>
          <button class="btn primary play" data-cmd="play" id="play-btn"><span>Play</span></button>
          <div class="row">
            <span class="row-label" id="players-label">Players</span>
            <div class="seg" role="radiogroup" aria-labelledby="players-label" id="players-seg">
              <button role="radio" data-players="1">1</button>
              <button role="radio" data-players="2">2</button>
              <button role="radio" data-players="3">3</button>
              <button role="radio" data-players="4">4</button>
            </div>
          </div>
          <div class="scores">
            <div class="scores-head">
              <h2 class="card-head">High scores</h2>
              <div class="seg tiny" id="scores-scope" hidden>
                <button data-scope="shared">Everyone</button>
                <button data-scope="local">Mine</button>
              </div>
            </div>
            <ol id="home-scores" class="score-list"></ol>
          </div>
          <nav class="toolbar">
            <button class="icon-btn" data-cmd="help" aria-label="How to play"><svg><use href="#i-help"/></svg><span>How to play</span></button>
            <button class="icon-btn" data-cmd="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
            <button class="icon-btn" data-cmd="fullscreen" aria-label="Full screen" data-fullscreen><svg><use href="#i-full"/></svg><span>Full screen</span></button>
          </nav>
        </div>
      </section>

      <!-- How to play -->
      <section class="card wide" id="panel-help" data-panel="help" hidden>
        <div class="card-frame">
          <h2 class="card-head">How to play</h2>
          <div class="help-controls" id="help-controls"></div>
          <figure class="help-card">
            <img id="help-instructions" alt="The original Totem instruction card">
            <figcaption>The machine's own instruction card.</figcaption>
          </figure>
          <button class="btn primary" data-cmd="back">Got it</button>
        </div>
      </section>

      <!-- Pause -->
      <section class="card" id="panel-pause" data-panel="pause" hidden>
        <div class="card-frame">
          <h2 class="card-title small">Paused</h2>
          <p class="card-sub" id="pause-score"></p>
          <div class="stack">
            <button class="btn primary" data-cmd="resume">Resume</button>
            <button class="btn" data-cmd="restart">Restart game</button>
            <button class="btn" data-cmd="help">How to play</button>
            <button class="btn" data-cmd="settings">Settings</button>
            <button class="btn" data-cmd="quit">Quit to menu</button>
          </div>
        </div>
      </section>

      <!-- Game over -->
      <section class="card" id="panel-over" data-panel="over" hidden>
        <div class="card-frame">
          <h2 class="card-title small">Game over</h2>
          <ol class="final" id="over-scores"></ol>
          <p class="card-sub" id="over-note"></p>
          <form class="entry" id="over-entry" hidden autocomplete="off">
            <label for="over-name" id="over-entry-label">New high score</label>
            <input id="over-name" maxlength="20" placeholder="Your name" spellcheck="false" autocapitalize="words" enterkeyhint="done" required>
            <button class="btn primary" type="submit">Save score</button>
          </form>
          <div class="stack" id="over-actions">
            <button class="btn primary" data-cmd="again">Play again</button>
            <button class="btn" data-cmd="quit">Menu</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-frame">
      <header class="dialog-head">
        <h1 id="settings-title">Settings</h1>
        <button class="icon-btn" value="close" aria-label="Close settings"><svg><use href="#i-close"/></svg></button>
      </header>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="game" aria-selected="true">Game</button>
        <button type="button" role="tab" data-tab="display">Display</button>
        <button type="button" role="tab" data-tab="sound">Sound</button>
        <button type="button" role="tab" data-tab="controls">Controls</button>
      </nav>
      <div class="tab-body" id="settings-body"></div>
    </form>
  </dialog>
  <div id="toasts" aria-live="polite"></div>
  <!--build:body-->
</body>
</html>
